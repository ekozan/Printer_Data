#####################################################################
#  print_macros.cfg
#  Macros d'impression pour Jubilee (toolchanger KTCC) + Trident (3 Z)
#
#  Ces macros sont appelees par le profil PrusaSlicer fourni dans
#  slicer/prusaslicer/. Voir slicer/prusaslicer/README.md
#
#  A activer avec  [include print_macros.cfg]  dans printer.cfg
#####################################################################


#####################################################################
#  Reglages centralises
#  C'est le SEUL endroit a modifier pour adapter la ligne d'amorce,
#  la position de parking et le profil de mesh.
#####################################################################

[gcode_macro _PRINT_VARS]
description: Variables partagees par PRINT_START / PRINT_END. Ne pas appeler.
# --- Ligne d'amorce (coordonnees G-code, offset outil applique) ---
variable_prime_x_start: 55.0      # debut de la ligne
variable_prime_x_end: 275.0       # fin de la ligne
variable_prime_y: 41.0            # bord avant du plateau
variable_prime_z: 0.3             # hauteur de la ligne
variable_prime_purge: 8.0         # purge stationnaire avant la ligne (mm de filament)
variable_prime_flow: 0.055        # mm de filament par mm de course (buse 0.4 / couche 0.3)
variable_prime_speed: 1500        # mm/min
# --- Fin d'impression ---
variable_end_z_hop: 10.0          # relevage Z avant de reposer l'outil
variable_end_retract: 3.0         # retract final (mm)
# --- Divers ---
variable_mesh_profile: 'default'  # profil charge quand PRINT_START recoit MESH=2
variable_standby_delta: 60.0      # T_standby = T_active - delta (plancher 140 C)
gcode:
    # Macro "porteuse de variables" uniquement, aucun mouvement.
    {action_respond_info("_PRINT_VARS est une macro de configuration, elle ne fait rien.")}


#####################################################################
#  PRINT_START
#
#  Appelee par le start G-code du slicer, par exemple :
#    PRINT_START BED=60 TOOL=0 T0=215 LAYERS=143
#
#  Parametres :
#    BED=      temperature plateau
#    TOOL=     outil a charger en premier (defaut 0)
#    T0..T4=   temperature premiere couche de chaque outil utilise
#              (les outils absents du G-code ne sont pas prechauffes)
#    LAYERS=   nombre total de couches (barre de progression Mainsail)
#    MESH=     0 = pas de mesh, 1 = BED_MESH_CALIBRATE (defaut),
#              2 = charge le profil _PRINT_VARS.mesh_profile
#    SOAK=     minutes de trempage thermique apres chauffe du plateau
#####################################################################

[gcode_macro PRINT_START]
description: Sequence de debut d'impression (homing, Z_TILT, mesh, outil, amorce)
gcode:
    {% set v     = printer['gcode_macro _PRINT_VARS'] %}
    {% set bed   = params.BED|default(60)|float %}
    {% set tool  = params.TOOL|default(0)|int %}
    {% set mesh  = params.MESH|default(1)|int %}
    {% set soak  = params.SOAK|default(0)|float %}
    {% set layers = params.LAYERS|default(0)|int %}

    CLEAR_PAUSE
    BED_MESH_CLEAR
    KTCC_INIT_PRINT_STATS
    {% if layers > 0 %}
        SET_PRINT_STATS_INFO TOTAL_LAYER={layers} CURRENT_LAYER=0
    {% endif %}

    # ---------- 1. Securite : aucun outil verrouille pendant le homing ----------
    {% set current = printer.toollock.tool_current|int %}
    {% if current == -2 %}
        { action_raise_error(
            "PRINT_START : l'outil courant est inconnu (-2). Lancez TOOL_UNLOCK, "
            ~ "reposez l'outil dans son dock a la main, puis SAVE_CURRENT_TOOL T-1.") }
    {% endif %}
    {% if current >= 0 %}
        M117 Rangement de l'outil T{current}
        KTCC_TOOL_DROPOFF_ALL
    {% endif %}
    # Les offsets d'outil fausseraient Z_TILT_ADJUST et BED_MESH_CALIBRATE.
    SET_GCODE_OFFSET X=0 Y=0 Z=0

    # ---------- 2. Chauffe du plateau + prechauffage des outils en standby ----------
    M140 S{bed}
    {% for n in range(5) %}
        {% set key = 'T' ~ n %}
        {% if params[key] is defined and params[key]|float > 0 %}
            {% if printer['tool ' ~ n] is defined %}
                {% set active  = params[key]|float %}
                {% set standby = [active - v.standby_delta|float, 140.0]|max %}
                M568 P{n} S{active} R{standby} A1
            {% else %}
                {action_respond_info("PRINT_START : le G-code demande T" ~ n
                    ~ " mais aucun [tool " ~ n ~ "] n'est configure, outil ignore.")}
            {% endif %}
        {% endif %}
    {% endfor %}

    # ---------- 3. Homing ----------
    M117 Prise d'origine
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # ---------- 4. Plateau a temperature avant de niveler (dilatation) ----------
    M117 Chauffe du plateau {bed|int}C
    M190 S{bed}
    {% if soak > 0 %}
        M117 Trempage {soak|int} min
        G4 P{(soak * 60000)|int}
    {% endif %}

    # ---------- 5. Nivellement Trident (3 moteurs Z) ----------
    M117 Nivellement Z_TILT
    Z_TILT_ADJUST
    G28 Z

    # ---------- 6. Maillage du plateau ----------
    {% if mesh == 1 %}
        M117 Palpage du plateau
        BED_MESH_CALIBRATE
    {% elif mesh == 2 %}
        BED_MESH_PROFILE LOAD={v.mesh_profile}
    {% endif %}

    # ---------- 7. Prise de l'outil initial ----------
    # T<n> -> _SET_ACTIVE_TOOL -> KTCC_T<n> : verrouillage, offsets et
    # attente de temperature sont geres par KTCC.
    M117 Chargement de T{tool}
    T{tool}
    M400

    # ---------- 8. Ligne d'amorce ----------
    _PRIME_LINE
    M117 Impression en cours


#####################################################################
#  PRINT_END
#####################################################################

[gcode_macro PRINT_END]
description: Sequence de fin d'impression (retract, rangement de l'outil, coupure)
gcode:
    {% set v     = printer['gcode_macro _PRINT_VARS'] %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set hop   = [v.end_z_hop|float, max_z - act_z - 1.0]|min %}

    M400
    M117 Fin d'impression

    # Retract + degagement Z avant tout deplacement horizontal
    G91
    M83
    {% if printer[printer.toolhead.extruder].can_extrude %}
        G1 E-{v.end_retract} F2100
    {% endif %}
    {% if hop > 0 %}
        G1 Z{hop} F3000
    {% endif %}
    G90

    # Coupure des chauffes et du ventilateur de piece
    M107
    M140 S0
    KTCC_SET_ALL_TOOL_HEATERS_OFF

    # Rangement de l'outil dans son dock (indispensable sur un Jubilee)
    TOOL_DROPOFF

    SET_GCODE_OFFSET X=0 Y=0 Z=0
    BED_MESH_CLEAR
    M84
    KTCC_DUMP_PRINT_STATS
    M117 Termine


#####################################################################
#  _PRIME_LINE
#####################################################################

[gcode_macro _PRIME_LINE]
description: Ligne d'amorce sur le bord avant du plateau. Ne pas appeler directement.
gcode:
    {% set v    = printer['gcode_macro _PRINT_VARS'] %}
    {% set x0   = v.prime_x_start|float %}
    {% set x1   = v.prime_x_end|float %}
    {% set y    = v.prime_y|float %}
    {% set z    = v.prime_z|float %}
    {% set len  = x1 - x0 %}
    {% set e    = len * v.prime_flow|float %}

    SAVE_GCODE_STATE NAME=PRIME_LINE
    G90
    G0 X{x0} Y{y} Z{z + 2.0} F9000
    G0 Z{z} F600
    M83
    G1 E{v.prime_purge} F300                       # purge stationnaire
    G1 X{x1} Y{y} E{e} F{v.prime_speed}            # aller
    G0 Y{y + 0.8} F9000
    G1 X{x0} E{e * 0.8} F{v.prime_speed}           # retour, legerement moins dense
    G1 E-0.4 F2100
    G0 Z{z + 3.0} F1500
    RESTORE_GCODE_STATE NAME=PRIME_LINE


#####################################################################
#  SET_TOOL_PRESSURE_ADVANCE
#  Permet au profil filament du slicer de regler le PA de l'outil
#  courant sans connaitre le nom de l'extrudeur Klipper :
#    SET_TOOL_PRESSURE_ADVANCE TOOL=1 ADVANCE=0.045
#####################################################################

[gcode_macro SET_TOOL_PRESSURE_ADVANCE]
description: Regle le pressure advance de l'extrudeur associe a un outil KTCC
gcode:
    {% set tool = params.TOOL|default(-1)|int %}
    {% set adv  = params.ADVANCE|default(0)|float %}
    {% set smooth = params.SMOOTH_TIME|default(0)|float %}
    {% if tool < 0 %}
        {% set tool = printer.toollock.tool_current|int %}
    {% endif %}
    {% if tool >= 0 and printer['tool ' ~ tool] is defined %}
        {% set ext = printer['tool ' ~ tool].extruder %}
        {% if ext is not none and ext|lower != 'none' %}
            {% if smooth > 0 %}
                SET_PRESSURE_ADVANCE EXTRUDER={ext} ADVANCE={adv} SMOOTH_TIME={smooth}
            {% else %}
                SET_PRESSURE_ADVANCE EXTRUDER={ext} ADVANCE={adv}
            {% endif %}
        {% endif %}
    {% else %}
        {action_respond_info("SET_TOOL_PRESSURE_ADVANCE : outil T" ~ tool ~ " inconnu, ignore.")}
    {% endif %}


#####################################################################
#  Annulation d'objets (Mainsail / Fluidd)
#  Le profil slicer emet des marqueurs "; printing object ...".
#  Moonraker les convertit en EXCLUDE_OBJECT_* si vous activez
#  enable_object_processing: True dans [file_manager] de moonraker.conf.
#####################################################################

[exclude_object]

# Compatibilite si vous passez le slicer en mode M486 (gcode_label_objects = firmware)
[gcode_macro M486]
description: Support M486 (annulation d'objet) via [exclude_object]
gcode:
    {% if 'exclude_object' not in printer %}
        {action_raise_error("[exclude_object] n'est pas active")}
    {% endif %}
    {% if 'T' in params %}
        EXCLUDE_OBJECT RESET=1
    {% endif %}
    {% if 'C' in params %}
        EXCLUDE_OBJECT CURRENT=1
    {% endif %}
    {% if 'P' in params %}
        EXCLUDE_OBJECT CANCEL=1 NAME={params.P}
    {% endif %}
    {% if 'S' in params %}
        {% if params.S == '-1' %}
            EXCLUDE_OBJECT_END
        {% else %}
            EXCLUDE_OBJECT_START NAME={params.S}
        {% endif %}
    {% endif %}
    {% if 'U' in params %}
        EXCLUDE_OBJECT RESET=1 NAME={params.U}
    {% endif %}
