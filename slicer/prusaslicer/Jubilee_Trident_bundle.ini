# Bundle de configuration PrusaSlicer
# Imprimante : Jubilee toolchanger (KTCC) + nivellement Trident 3 Z
# Carte      : Duet2 + Duex5 (SAM4E8E) - Klipper / Mainsail
#
# Import : PrusaSlicer > Fichier > Importer > Importer une configuration (bundle)
# Prerequis cote Klipper : [include print_macros.cfg] dans printer.cfg
#
# Cible : PrusaSlicer 2.7 / 2.8 / 2.9.x
# PrusaSlicer 3.0 (alpha) ne gere pas encore les imprimantes custom : voir README.md §7.
# Voir README.md pour la procedure de verification de la zone d'impression.


# ###################################################################
# #  PROFILS D'IMPRESSION
# ###################################################################

