# Profils filament.
# Aucun M104/M109 ici : PRINT_START pose les temperatures, KTCC gere ensuite
# actif / standby par outil.
# Le pressure advance est applique par SET_TOOL_PRESSURE_ADVANCE, qui resout
# l'extrudeur Klipper (extruder, extruder1, ...) depuis le numero d'outil KTCC.

kind: filament
id: '*JT filament commun*'
values:
  filament_diameter: 1.75
  extrusion_multiplier: 1
  filament_cost: 25
  filament_spool_weight: 200
  filament_vendor: Sans marque
  filament_soluble: 0
  min_print_speed: 15
  slowdown_below_layer_time: 8
  filament_multitool_ramming: 0
  filament_minimal_purge_on_wipe_tower: 15

---
kind: filament
id: ekozan-filament-pla
name: Generic PLA @JT
inherits:
- '*JT filament commun*'
condition: printer.base_model == "JUBILEE"
values:
  filament_type: PLA
  filament_density: 1.24
  temperature: 215
  first_layer_temperature: 220
  bed_temperature: 60
  first_layer_bed_temperature: 60
  fan_always_on: 1
  min_fan_speed: 100
  max_fan_speed: 100
  bridge_fan_speed: 100
  disable_fan_first_layers: 1
  full_fan_speed_layer: 4
  fan_below_layer_time: 100
  filament_max_volumetric_speed: 15
  start_filament_gcode: |
    ; PLA sur T{current_extruder}
    SET_TOOL_PRESSURE_ADVANCE TOOL={current_extruder} ADVANCE=0.068

