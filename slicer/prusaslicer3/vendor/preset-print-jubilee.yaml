# Profils d'impression. En 3.0 la retraction appartient au profil
# d'impression (et non plus au profil imprimante comme en 2.9).

kind: print
id: '*JT commun*'
values:
  default_material: Generic PLA @JT
  # Bornes de la hauteur de couche variable. Ce sont des options 'print' en
  # 3.0 (elles etaient dans le profil imprimante en 2.9) ; la valeur haute
  # suit le diametre de buse, d'ou la surcharge dans la variante 0.6.
  min_layer_height: 0.05
  max_layer_height: 0.32
  arc_fitting: disabled
  gcode_comments: 0
  gcode_label_objects: octoprint
  perimeter_generator: arachne
  # Entrerait en conflit avec la gestion standby de KTCC (M568 A1).
  ooze_prevention: 0
  standby_temperature_delta: -5
  # La ligne d'amorce est faite par PRINT_START.
  skirts: 0
  skirt_distance: 3
  skirt_height: 1
  brim_width: 0
  brim_type: outer_only
  brim_separation: 0.1
  elefant_foot_compensation: 0.15
  slice_closing_radius: 0.049
  resolution: 0.01
  xy_size_compensation: 0
  seam_position: aligned
  external_perimeters_first: 0
  extra_perimeters: 0
  thin_walls: 0
  gap_fill_enabled: 1
  overhangs: 1
  thick_bridges: 0
  fill_angle: 45
  fill_density: 15%
  fill_pattern: grid
  top_fill_pattern: monotoniclines
  bottom_fill_pattern: monotoniclines
  infill_anchor: 2.5
  infill_anchor_max: 12
  infill_overlap: 23%
  infill_first: 0
  ironing: 0
  # coEnum en 3.0 : none / enforcers_only / everywhere (c'etait un booleen en 2.9)
  support_material: none
  support_material_style: snug
  support_material_threshold: 55
  support_material_contact_distance: 0.2
  support_material_interface_layers: 3
  support_material_xy_spacing: 80%
  dont_support_bridges: 1
  # Retraction (Rapido, entrainement direct)
  retract_length: 0.6
  retract_speed: 40
  deretract_speed: 30
  retract_before_travel: 1.5
  retract_layer_change: 1
  retract_lift: 0.2
  retract_lift_above: 0
  retract_lift_below: 219
  retract_restart_extra: 0
  retract_before_wipe: 70%
  retract_length_toolchange: 0
  retract_restart_extra_toolchange: 0
  wipe: 1
  # Tour de purge : sans effet avec un seul outil. La position n'est plus
  # reglable en 3.0 (wipe_tower_x / wipe_tower_y ont ete supprimes).
  wipe_tower: 1
  wipe_tower_width: 60
  wipe_tower_brim_width: 2
  wipe_tower_cone_angle: 0
  wipe_tower_no_sparse_layers: 0
  wipe_tower_extruder: 0
  # Vitesses et accelerations : plafonnees par max_velocity 800 et
  # max_accel 10000 de [printer] dans printer.cfg.
  travel_speed: 400
  travel_speed_z: 5
  max_print_speed: 400
  perimeter_speed: 120
  external_perimeter_speed: 80
  small_perimeter_speed: 60
  infill_speed: 200
  solid_infill_speed: 200
  top_solid_infill_speed: 120
  gap_fill_speed: 80
  bridge_speed: 60
  support_material_speed: 80
  first_layer_speed: 30
  first_layer_speed_over_raft: 30
  default_acceleration: 6000
  perimeter_acceleration: 4000
  external_perimeter_acceleration: 3000
  infill_acceleration: 8000
  solid_infill_acceleration: 6000
  top_solid_infill_acceleration: 4000
  bridge_acceleration: 3000
  travel_acceleration: 10000
  first_layer_acceleration: 1000
  # Largeurs d'extrusion (buse 0.4)
  extrusion_width: 0.45
  first_layer_extrusion_width: 0.45
  perimeter_extrusion_width: 0.45
  external_perimeter_extrusion_width: 0.45
  solid_infill_extrusion_width: 0.45
  perimeters: 3
  top_solid_layers: 5
  bottom_solid_layers: 4
  top_solid_min_thickness: 0.8
  bottom_solid_min_thickness: 0.6

---
kind: print
id: ekozan-print-015
inherits:
- '*JT commun*'
variants:
- condition: printer.base_model == "JUBILEE" and tool.nozzle_diameter == 0.4
  name: 0.15mm DETAIL @JT
  id: ekozan-print-015-v
  values:
    layer_height: 0.15
    first_layer_height: 0.2
    top_solid_layers: 6
    bottom_solid_layers: 5
    perimeter_speed: 100
    external_perimeter_speed: 65
    infill_speed: 180
    solid_infill_speed: 180

