# Declaration materielle du vendeur pour PrusaSlicer 3.0
# Schema : specs/presets/vendor-schema.json (depot PrusaSlicer)
#
# Un document par bloc, separes par ---
#   vendor         : identite + declaration des "features"
#   printer        : le modele d'imprimante (capacites + visuel)
#   tool           : une tete selectionnable ; 'condition' decide si elle est
#                    proposee pour une imprimante donnee
#   sheet          : une surface d'impression
#   printer_config : ce que l'utilisateur choisit reellement
#
# Invariant impose par HwConfigEvaluator::create_printer_config :
#   len(printer_config.tools) doit valoir 1 ou tool_count.
# Une seule entree suffit : elle sert de tete par defaut et remplit les autres
# emplacements. Le choix du diametre de buse vient des documents 'tool'.

kind: vendor
id: Ekozan
name: Ekozan - Jubilee
version: 1.0.2
features:
  printer: {}
  tool:
    nozzle_diameter:
      default: 0.4

---
# Un seul modele : le nombre d'outils est porte par les printer_config.
# Le nom affiche est construit par suggest_name a partir de ce 'name',
# suffixe du nombre d'outils et de la buse -> "Jubilee Trident 5T 0.4".
kind: printer
technology: FFF
id: jubilee
name: Jubilee Trident
model:
  base_model: JUBILEE
  model: JUBILEE
tool_count: 1
visual:
  bed_texture: jubilee_bed.png
  thumbnail: jubilee_thumbnail.png

---
kind: tool
technology: FFF
id: '0.4'
name: '0.4'
condition: printer.base_model == "JUBILEE"
features:
  nozzle_diameter:
    default: 0.4

---
kind: tool
technology: FFF
id: '0.6'
name: '0.6'
condition: printer.base_model == "JUBILEE"
features:
  nozzle_diameter:
    default: 0.6

---
kind: sheet
id: pei_textured
name: PEI texture
type: pei_textured

---
# Le seul outil monte aujourd'hui ([tool 0] dans tools.cfg)
kind: printer_config
id: jubilee-1t
name: Jubilee Trident
printer: jubilee
tool_count: 1
tools:
- tool: '0.4'
sheet: pei_textured

---
# Pret pour quand T1..T4 seront montes
kind: printer_config
id: jubilee-5t
name: Jubilee Trident
printer: jubilee
tool_count: 5
tools:
- tool: '0.4'
sheet: pei_textured
